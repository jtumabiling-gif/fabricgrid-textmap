name: fabricgrid
description: "A mobile app for FabricGrid design - a marketplace for fabric services."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  get: ^4.6.6
  provider: ^6.0.0
  page_transition: ^2.1.0
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.1
  
  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  
  # Date & Time
  intl: ^0.19.0
  
  # Images & Media
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  
  # Location
  # geolocator: ^9.0.2
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  
  # Maps
  maps_launcher: ^2.1.3
  url_launcher: ^6.0.0
  
  # Authentication
  firebase_core: ^2.24.0
  firebase_auth: ^4.19.0
  
  # Cloud Services
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.6.0
  
  # Utilities
  uuid: ^4.0.0
  permission_handler: ^11.0.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/textmap_icon.png"


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Custom fonts removed - using Material Design defaults
  # Uncomment and provide font files if custom fonts are needed
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
